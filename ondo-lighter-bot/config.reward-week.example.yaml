# 검토용 리워드 대상 후보. 현재 주간 BTC/ETH만 허용한다.
# 기존 LIT/ENA 포지션을 별도 승인 없이 정리하거나 이 설정으로 갈아타지 않는다.
# 기본 주문 없음. live 전환·기존 포지션 정리는 별도 범위 승인 필요.
# 정책 만료: 2026-11-03 09:00 KST. 새 주간 공지 확인 전 자동 연장하지 않는다.
# 18bps는 마켓당 주간 5,000 USDC 중 5% 구간이다. 수익 보장 없음.
# 손실 25 USD는 시작 자산 대비 호가 중단 기준이며 최대 손실 보장이 아니다.

mode: dry_run

ondo:                            # Ondo 샌드박스는 팀 승인이 필요해서 메인넷을 쓴다
  rest_url: https://api.ondoperps.xyz
  ws_url: wss://api.ondoperps.xyz/ws
  rest_rate_per_sec: 1.0
  rest_reserved_per_min: 10
  leverage: 3
  deadman_timeout_sec: 30        # 봇이 죽으면 30초 안에 Ondo 호가 자동 취소
  deadman_heartbeat_sec: 10

lighter:
  base_url: https://mainnet.zklighter.elliot.ai
  ws_url: wss://mainnet.zklighter.elliot.ai/stream
  leverage: 3

quoting:
  band_bps: 25
  offset_bps: 18
  requote_threshold_bps: 6
  skew_bps_per_1k: 20            # 소액이라 재고 100달러에도 2bps는 밀리게 크게 둔다
  basis_deviation_bps: 15
  basis_window_sec: 3600
  basis_sanity_bps: 100
  quote_when_underlying_closed: false
  inventory_mode: flatten

hedging:
  max_slippage_bps: 15
  retries: 3
  reconcile_interval_sec: 10

risk:
  max_unhedged_usd: 40           # 헷지 안 된 노출이 40달러를 20초 넘기면 전체 정지
  max_unhedged_sec: 20
  ws_stale_sec: 10
  max_margin_usage: 0.6
  daily_loss_limit_usd: 25       # 시작 대비 자산이 25달러 줄면 호가 정지. 최대 손실 보장 아님 (자산은 약 1분마다 조회)
  max_total_inventory_usd: 350
  positions_stale_sec: 30        # 양쪽 포지션 조회가 30초 넘게 실패하면 호가 일시정지

markets:
  - base: BTC
    size_usd_per_side: 60
    max_inventory_usd: 200
  - base: ETH
    size_usd_per_side: 60
    max_inventory_usd: 200

rewards:
  policy_path: docs/rewards-2026-10-27.json

market_data:
  ondo_rest_url: https://api.ondoperps.xyz
  ondo_ws_url: wss://api.ondoperps.xyz/ws
  lighter_rest_url: https://mainnet.zklighter.elliot.ai
  lighter_ws_url: wss://mainnet.zklighter.elliot.ai/stream?readonly=true
  ondo_ping_sec: 30
  lighter_ping_sec: 60

storage:
  sqlite_path: data/olbot.sqlite
  log_path: data/olbot.log
  quote_snapshot_sec: 30
  band_depth_sec: 300
  basis_sample_sec: 10
