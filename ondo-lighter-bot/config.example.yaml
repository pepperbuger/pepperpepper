# config.yaml로 복사해서 사용한다. 비밀값은 여기에 넣지 말고 .env에 넣는다.

mode: dry_run            # dry_run | live (live는 실행 시 --live 플래그도 필요)

ondo:
  rest_url: https://api.ondoperps-sandbox.xyz   # 메인넷: https://api.ondoperps.xyz (샌드박스는 팀 승인 필요, 없으면 메인넷으로)
  ws_url: wss://api.ondoperps-sandbox.xyz/ws     # 메인넷: wss://api.ondoperps.xyz/ws
  rest_rate_per_sec: 1.0         # 공개 베타 기본 제한
  rest_reserved_per_min: 10      # 대사와 비상 취소용으로 남겨둘 요청 수
  leverage: 3
  deadman_timeout_sec: 30
  deadman_heartbeat_sec: 10

lighter:
  base_url: https://testnet.zklighter.elliot.ai  # 메인넷: https://mainnet.zklighter.elliot.ai
  ws_url: wss://testnet.zklighter.elliot.ai/stream
  leverage: 3

quoting:
  band_bps: 25                   # 리워드 인정 범위로 추정 (SPEC 11번에서 확인)
  offset_bps: 18                 # 중간가에서 호가까지 거리
  requote_threshold_bps: 6
  skew_bps_per_1k: 2             # 재고 1,000달러당 호가를 미는 정도
  basis_deviation_bps: 15        # 괴리가 최근 중앙값에서 이만큼 벗어나면 그 마켓 호가 중단
  basis_window_sec: 3600         # 중앙값을 계산하는 기간
  basis_sanity_bps: 100          # 괴리 자체가 이보다 크면 다른 자산으로 보고 제외 (예: OPENAI)
  quote_when_underlying_closed: false
  inventory_mode: flatten        # flatten | hold_for_funding

hedging:
  max_slippage_bps: 15
  retries: 3
  reconcile_interval_sec: 10
  ondo_rest_reconcile_sec: 30

risk:
  max_unhedged_usd: 300
  max_unhedged_sec: 20
  ws_stale_sec: 10
  max_margin_usage: 0.5
  daily_loss_limit_usd: 100
  max_total_inventory_usd: 5000

markets:                         # 1주차 후보. ondo_depth_probe.py 결과로 교체
  - base: LIT
    size_usd_per_side: 500
    max_inventory_usd: 2000
  - base: NEAR
    size_usd_per_side: 500
    max_inventory_usd: 2000
  - base: ENA
    size_usd_per_side: 750
    max_inventory_usd: 2000
  - base: SOL                    # 두꺼운 마켓과 비교용
    size_usd_per_side: 750
    max_inventory_usd: 2000

market_data:                     # 시세 수신용 공개 엔드포인트. 읽기 전용이라 메인넷을 쓴다
  ondo_rest_url: https://api.ondoperps.xyz
  ondo_ws_url: wss://api.ondoperps.xyz/ws
  lighter_rest_url: https://mainnet.zklighter.elliot.ai
  lighter_ws_url: wss://mainnet.zklighter.elliot.ai/stream?readonly=true
  ondo_ping_sec: 30              # Ondo는 180초 무응답이면 끊는다
  lighter_ping_sec: 60           # Lighter는 2분 무응답이면 끊는다

storage:
  sqlite_path: data/olbot.sqlite
  log_path: data/olbot.log
  quote_snapshot_sec: 30
  band_depth_sec: 300
  basis_sample_sec: 10           # watch가 괴리를 기록하는 간격
